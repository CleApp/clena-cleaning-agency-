<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>CLENA Admin</title>
<style>
:root{--blue:#0B5FD6;--navy:#08264F;--green:#12B76A;--line:#D5E3F2;--bg:#F2F8FF;--ink:#0A1F3D;--muted:#4E6482}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--green);color:#04281A}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.6;cursor:wait}
input,select{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
#login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px}
#login h1{margin:0 0 4px;font-size:26px}#login p{margin:0 0 20px;color:var(--muted)}
#login label{display:block;font-weight:600;margin:12px 0 4px}#login input{width:100%}
#login .btn{width:100%;margin-top:20px}
.err{color:#C0362C;min-height:20px;margin-top:10px}
#app{display:none}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header b{font-size:19px;letter-spacing:.03em}
main{max-width:1200px;margin:0 auto;padding:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat span{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:30px;line-height:1.2}
.stat.g strong{color:#0A8F52}.stat.b strong{color:var(--blue)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bar input{flex:1;min-width:200px}
.wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;background:#F8FBFF}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
tr.fresh{animation:fresh 2.5s ease-out}
@keyframes fresh{from{background:#D8F5E6}to{background:transparent}}
select.st{font-weight:700;padding:6px 10px}
.st[data-v=new]{background:#DCEBFF;border-color:#9CC3F5}.st[data-v=confirmed]{background:#FFF4D6;border-color:#EBCB77}
.st[data-v=done]{background:#D8F5E6;border-color:#7ED3A9}.st[data-v=cancelled]{background:#EEE;border-color:#CCC;color:#666}
#toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;transform:translateY(120px);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);max-width:320px}
#toast.show{transform:none}
</style></head>
<body>
<section id="login">
  <h1>CLENA Admin</h1><p>Staff sign-in</p>
  <form id="lf">
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="le" role="alert"></div>
    <button class="btn" id="lb">Sign in</button>
  </form>
</section>

<div id="app">
  <header><b>CLENA bookings</b><div><span id="who" style="margin-right:12px;opacity:.8"></span><button class="btn alt" id="out">Sign out</button></div></header>
  <main>
    <div class="stats">
      <div class="stat b"><span>New requests</span><strong id="sNew">0</strong></div>
      <div class="stat"><span>Confirmed</span><strong id="sConf">0</strong></div>
      <div class="stat"><span>Completed</span><strong id="sDone">0</strong></div>
      <div class="stat g"><span>Estimated earnings (completed)</span><strong id="sRev">$0</strong></div>
    </div>
    <div class="bar">
      <input id="q" type="search" placeholder="Search name, email, phone or service" aria-label="Search bookings">
      <select id="f" aria-label="Filter by status"><option value="">All statuses</option><option>new</option><option>confirmed</option><option>done</option><option>cancelled</option></select>
      <button class="btn alt" id="csv">Export CSV</button>
    </div>
    <div class="wrap"><table>
      <thead><tr><th>Received</th><th>Customer</th><th>Service</th><th>Preferred date</th><th>Estimate</th><th>Status</th><th>Note</th></tr></thead>
      <tbody id="rows"></tbody>
    </table><div class="empty" id="empty" hidden>No bookings match.</div></div>
  </main>
</div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
/* ---- PASTE YOUR KEYS (same as index.html) ---- */
const SUPABASE_URL="https://qidhdssduuvwiunrqkse.supabase.co/rest/v1/",SUPABASE_ANON_KEY="sb_publishable_T5QxLmvYQPoi3INishClJg_bsLdpClH";
let sb=null;try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){}
const $=s=>document.querySelector(s);
let data=[],fresh=new Set(),chan=null;
const STATUSES=["new","confirmed","done","cancelled"];

function h(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const k in attrs){k==="text"?e.textContent=attrs[k]:e.setAttribute(k,attrs[k])}
  kids.forEach(c=>c&&e.append(c));return e;
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3500)}
const money=n=>"$"+Math.round(n||0).toLocaleString();

/* auth */
if(!sb){$("#le").textContent="Add your Supabase keys at the top of admin.html."}
$("#lf").addEventListener("submit",async e=>{
  e.preventDefault();if(!sb)return;
  $("#lb").disabled=true;$("#le").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("#em").value,password:$("#pw").value});
  $("#lb").disabled=false;
  if(error)$("#le").textContent="Sign-in failed. Check your email and password.";else start();
});
$("#out").onclick=async()=>{await sb.auth.signOut();if(chan)sb.removeChannel(chan);$("#app").style.display="none";$("#login").style.display="block"};

async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  $("#login").style.display="none";$("#app").style.display="block";
  $("#who").textContent=session.user.email;
  await load();
  chan=sb.channel("bookings").on("postgres_changes",{event:"*",schema:"public",table:"bookings"},p=>{
    if(p.eventType==="INSERT"){fresh.add(p.new.id);toast("New booking from "+p.new.name)}
    load();
  }).subscribe();
}

async function load(){
  const {data:rows,error}=await sb.from("bookings").select("*").order("created_at",{ascending:false});
  if(error){toast("Couldn't load bookings: "+error.message);return}
  data=rows;render();
}

function render(){
  const q=$("#q").value.toLowerCase(),f=$("#f").value;
  const list=data.filter(b=>(!f||b.status===f)&&(!q||[b.name,b.email,b.phone,b.service].join(" ").toLowerCase().includes(q)));
  const body=$("#rows");body.replaceChildren();
  list.forEach(b=>{
    const sel=h("select",{class:"st","data-v":b.status,"aria-label":"Status for "+b.name});
    STATUSES.forEach(s=>{const o=h("option",{value:s,text:s});if(s===b.status)o.selected=true;sel.append(o)});
    sel.onchange=async()=>{
      const {error}=await sb.from("bookings").update({status:sel.value}).eq("id",b.id);
      if(error){toast("Update failed: "+error.message);sel.value=b.status}else{sel.dataset.v=sel.value;toast("Marked "+sel.value)}
    };
    const tr=h("tr",{},
      h("td",{text:new Date(b.created_at).toLocaleString([],{dateStyle:"medium",timeStyle:"short"})}),
      h("td",{},h("b",{text:b.name}),h("small",{text:b.email}),h("small",{text:b.phone})),
      h("td",{text:b.service||""}),
      h("td",{text:b.preferred_date||""}),
      h("td",{text:money(b.estimate)}),
      h("td",{},sel),
      h("td",{text:b.note||""}));
    if(fresh.has(b.id)){tr.className="fresh";fresh.delete(b.id)}
    body.append(tr);
  });
  $("#empty").hidden=list.length>0;
  const c=s=>data.filter(b=>b.status===s);
  $("#sNew").textContent=c("new").length;$("#sConf").textContent=c("confirmed").length;$("#sDone").textContent=c("done").length;
  $("#sRev").textContent=money(c("done").reduce((a,b)=>a+Number(b.estimate||0),0));
}
$("#q").oninput=render;$("#f").onchange=render;

$("#csv").onclick=()=>{
  const cols=["created_at","name","email","phone","service","preferred_date","estimate","status","note"];
  const cell=v=>{let s=String(v??"");if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
  const csv=[cols.join(",")].concat(data.map(b=>cols.map(k=>cell(b[k])).join(","))).join("\n");
  const a=h("a",{href:URL.createObjectURL(new Blob([csv],{type:"text/csv"})),download:"clena-bookings.csv"});a.click();
};

if(sb)start();
</script>
</body></html>
